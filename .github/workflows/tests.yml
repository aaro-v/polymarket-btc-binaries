name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - run: ruff check .
      - run: pytest
