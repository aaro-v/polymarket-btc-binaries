[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-15m-binaries"
version = "0.1.0"
description = "Volatility forecasting, binary pricing and a pre-registered test of Polymarket's 15-minute bitcoin markets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pyarrow>=15",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
btcbin = "btcbin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
